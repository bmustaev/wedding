<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admins — Wedding Admin</title>
  <link rel="stylesheet" href="css/shared.css" />
</head>
<body data-i18n-title="super-admin-doc-title">
  <div class="app-shell">
    <aside class="sidebar">
      <div style="display:flex; justify-content:flex-end; margin-bottom:0.75rem;">
        <div class="lang-toggle" id="lang-switcher">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="ru">RU</button>
        </div>
      </div>
      <div class="sidebar-brand" data-i18n="app-brand">Wedding Admin</div>
      <div class="sidebar-role" data-i18n="sidebar-role-super">Super admin</div>

      <nav class="sidebar-nav">
        <button type="button" id="nav-back" data-i18n="nav-back-to-dashboard">&larr; Back to my dashboard</button>
        <button type="button" data-target="admins" class="active" data-i18n="nav-admins">Admins</button>
      </nav>

      <div class="sidebar-footer">
        <div class="field-hint" id="sidebar-username" style="margin-bottom:0.6em;"></div>
        <button type="button" class="btn btn-sm" id="logout-btn" data-i18n="sign-out">Sign out</button>
      </div>
    </aside>

    <main class="content">
      <!-- ============================= ADMIN LIST ============================= -->
      <section data-panel="admins" class="active">
        <div class="content-header">
          <div>
            <h1 data-i18n="admins-heading">Admins</h1>
            <p class="field-hint" style="margin:0;" data-i18n="admins-subtitle">Every admin's own guest list stays private from every other admin — you can view, but not edit, from here.</p>
          </div>
          <div class="actions">
            <button type="button" class="btn btn-primary" id="add-admin-btn" data-i18n="new-admin-btn">New admin</button>
          </div>
        </div>

        <div id="admins-error" class="banner banner-error" hidden></div>
        <div id="admins-container"></div>
      </section>

      <!-- ============================= ADMIN'S GUESTS (drill-down) ============================= -->
      <section data-panel="admin-guests">
        <div class="content-header">
          <div>
            <h1 id="admin-guests-title">Guests</h1>
            <p class="field-hint" style="margin:0;" data-i18n="admin-guests-subtitle">Read-only view.</p>
          </div>
          <div class="actions">
            <button type="button" class="btn btn-sm" id="back-to-admins-btn" data-i18n="back-to-admins-btn">&larr; Back to admins</button>
          </div>
        </div>

        <div id="admin-guests-error" class="banner banner-error" hidden></div>
        <div id="admin-guests-container"></div>
        <div id="admin-guests-pager" class="pager"></div>
      </section>
    </main>
  </div>

  <!-- ============================= NEW ADMIN MODAL ============================= -->
  <div class="modal-backdrop" id="admin-modal-backdrop" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 data-i18n="new-admin-modal-title">New admin</h2>
        <button type="button" class="modal-close" id="admin-modal-close" aria-label="Close">&times;</button>
      </div>

      <div id="admin-modal-error" class="banner banner-error" hidden></div>

      <form id="admin-form">
        <div class="field">
          <label for="admin-username" data-i18n="admin-username-label">Username</label>
          <input type="text" id="admin-username" minlength="3" maxlength="64" required />
        </div>
        <div class="field">
          <label for="admin-side" data-i18n="admin-side-label">Side</label>
          <select id="admin-side" required>
            <option value="BRIDE" data-i18n="side-bride">Bride</option>
            <option value="GROOM" data-i18n="side-groom">Groom</option>
          </select>
        </div>
        <div class="field">
          <label for="admin-password" data-i18n="admin-password-label">Password</label>
          <input type="password" id="admin-password" minlength="8" maxlength="128" required />
          <p class="field-hint" data-i18n="admin-password-hint">At least 8 characters. Share it with them directly — it won't be shown again here.</p>
        </div>
      </form>

      <div class="modal-footer">
        <button type="button" class="btn" id="admin-cancel-btn" data-i18n="cancel-btn">Cancel</button>
        <button type="button" class="btn btn-primary" id="admin-save-btn" data-i18n="create-admin-btn">Create admin</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/super-admin.js"></script>
</body>
</html>
