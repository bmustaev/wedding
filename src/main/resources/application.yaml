spring:
  application:
    name: wedding
  datasource:
    url: jdbc:mariadb://localhost:3306/wedding?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.mariadb.jdbc.Driver
  # Optional: JPA/Hibernate settings (if you are using Spring Data JPA)
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      # Schema is owned by schema.sql/data.sql, not by Hibernate.
      # "validate" catches drift between entities and the real schema
      # without ever letting the app mutate DDL itself.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_uuid_jdbc_type: CHAR
  sql:
    init:
      mode: always
      separator: "$$"
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always
    include-exception: true

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    # Replace with your actual project base package
    uz.bobnoza.wedding: DEBUG
#test-password-123
app:
  jwt:
    # Generate a real 256-bit+ secret for production; this is a placeholder.
    secret: ${JWT_SECRET:REPLACE_WITH_A_LONG_RANDOM_SECRET_AT_LEAST_32_BYTES}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  media:
    # Counts and video length are mirrored by the database
    # (trg_guest_media_limit, ck_guest_media_video_duration) — change together.
    max-photos-per-guest: 15
    max-videos-per-guest: 4
    max-video-seconds: 60
    # Originals are kept as uploaded: a 60 s iPhone 4K/60 clip is ~400 MB.
    max-photo-size: 40MB
    max-video-size: 500MB
    storage-dir: ${MEDIA_STORAGE_DIR:./media-storage}
    # Uploads arrive in chunks of this size (resumable — see MediaUploadService).
    chunk-size: 8MB
    upload-session-ttl: 24h
    # New uploads are refused (507) once free disk space would drop below this.
    min-free-disk: ${MEDIA_MIN_FREE_DISK:30GB}
    # Browser-safe copies made from every upload (see MediaProcessor).
    photo-display-px: 2560
    thumb-px: 480
    max-video-px: 1920        # long edge, i.e. 1080p
    # Conversion workers — sized for an 8-core box: 2 x 3 ffmpeg threads for
    # video leaves ~2 cores for the app and MariaDB.
    photo-workers: 2
    video-workers: 2
    video-threads: 3
    # Lifetime of the signed file links handed out in media responses.
    url-ttl: 12h
    # Fail startup when ffmpeg/ffprobe/libvips (with HEIC support) are missing.
    require-tools: ${MEDIA_REQUIRE_TOOLS:true}
    tools:
      ffmpeg: ${FFMPEG_PATH:ffmpeg}
      ffprobe: ${FFPROBE_PATH:ffprobe}
      vips: ${VIPS_PATH:vips}
      vipsheader: ${VIPSHEADER_PATH:vipsheader}
      vipsthumbnail: ${VIPSTHUMBNAIL_PATH:vipsthumbnail}
  playlist:
    # Ducats (paper props, paid to the DJ in person) for one song.
    song-price: 15
    # Unpaid orders one guest may have at a time — mirrored by the database
    # (trg_song_orders_insert), change together.
    max-pending-orders: 3
  seating:
    default-table-capacity: 12
  invitation:
    base-url: ${INVITATION_BASE_URL:http://localhost:8080/i}

